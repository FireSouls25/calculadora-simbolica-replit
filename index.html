<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Calculadora.ipynb — Forma</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/mathlive@0.111.0/mathlive-fonts.css" />
    <script defer src="https://unpkg.com/mathlive@0.111.0/mathlive.min.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header class="notebook-bar">
      <a class="brand" href="/" aria-label="Calculadora">forma<span>.</span></a>
      <div class="notebook-title">
        <strong>Calculadora.ipynb</strong>
        <span id="save-state">guardado localmente</span>
      </div>
      <nav class="toolbar" aria-label="Acciones del cuaderno">
        <button id="new-cell" class="toolbar-button" type="button" title="Añadir celda">＋ <span>Celda</span></button>
        <button id="run-current" class="toolbar-button run-toolbar" type="button" title="Ejecutar y avanzar (Shift + Enter)">▶ <span>Ejecutar</span></button>
        <button id="open-converter" class="toolbar-button" type="button" title="Convertir unidades">⇄ <span>Unidades</span></button>
      </nav>
    </header>

    <main class="notebook-main">
      <p class="shortcut-hint">Escribe en una celda · <kbd>Shift</kbd> + <kbd>Enter</kbd> ejecuta y continúa</p>
      <section id="cells" class="cells" aria-label="Celdas del cuaderno"></section>

      <button id="empty-add-cell" class="empty-add-cell" type="button">
        <span>＋</span> Añadir una celda
      </button>

      <details class="symbol-panel">
        <summary><span class="sigma">∑</span> Insertar símbolos <span class="summary-hint">raíces, fracciones, funciones</span></summary>
        <div class="symbol-keys" aria-label="Teclado matemático">
          <button class="symbol-key" data-insert="\sqrt{#?}" title="Raíz; pulsa → para salir">√ <span>raíz</span></button>
          <button class="symbol-key" data-insert="\frac{#?}{#?}" title="Fracción">a⁄b <span>fracción</span></button>
          <button class="symbol-key" data-insert="^{#?}" title="Potencia">x<sup>n</sup></button>
          <button class="symbol-key" data-insert="\pi" title="Pi">π</button>
          <button class="symbol-key" data-insert="\sin\left(#?\right)">sin</button>
          <button class="symbol-key" data-insert="\cos\left(#?\right)">cos</button>
          <button class="symbol-key" data-insert="\ln\left(#?\right)">ln</button>
          <span class="symbol-help">Las flechas mueven el cursor dentro de cada estructura.</span>
        </div>
      </details>
    </main>

    <div class="modal-backdrop" id="converter-modal" hidden>
      <section class="converter-dialog" role="dialog" aria-modal="true" aria-labelledby="converter-title">
        <div class="dialog-heading">
          <div><span class="eyebrow">CONVERSOR</span><h2 id="converter-title">Unidades</h2></div>
          <button id="close-converter" class="close-button" type="button" aria-label="Cerrar">×</button>
        </div>
        <label class="field-label" for="unit-category">Magnitud</label>
        <select id="unit-category" class="select-control">
          <option value="length">Longitud</option><option value="mass">Masa</option>
          <option value="temperature">Temperatura</option><option value="volume">Volumen</option>
          <option value="time">Tiempo</option><option value="speed">Velocidad</option>
          <option value="area">Área</option><option value="data">Datos</option>
        </select>
        <div class="conversion-row">
          <label class="conversion-field"><span class="field-label">Valor · origen</span>
            <div class="value-unit"><input id="unit-value" type="number" value="1" step="any" /><select id="unit-from" class="select-control"></select></div>
          </label>
          <button class="swap-button" id="swap-units" type="button" title="Intercambiar unidades">⇄</button>
          <label class="conversion-field"><span class="field-label">Destino</span><select id="unit-to" class="select-control"></select></label>
        </div>
        <button id="convert-button" class="convert-button" type="button">Convertir</button>
        <div id="conversion-result" class="conversion-result" aria-live="polite">
          <span class="result-caption">RESULTADO</span><strong>—</strong><span class="result-unit"></span>
        </div>
        <div id="conversion-error" class="conversion-error" role="alert"></div>
      </section>
    </div>
  </body>
</html>
